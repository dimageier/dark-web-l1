<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Dark Web — Level 1: The 3-Hour Podcast</title>
<style>html,body{margin:0;height:100%;background:#141210;color:#efe9dc;font:14px system-ui,sans-serif;display:grid;place-items:center}</style>
</head><body><p>Loading…</p>
<script>
(async()=>{
try{
const N=7;
const parts=await Promise.all(Array.from({length:N},(_,i)=>fetch("c"+i+".txt?v=podcast3").then(r=>{if(!r.ok)throw new Error(r.status+" c"+i);return r.text();})));
const b64=parts.join("");
const bin=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));
const ds=new DecompressionStream("gzip");
const ab=await new Response(new Blob([bin]).stream().pipeThrough(ds)).arrayBuffer();
const text=new TextDecoder().decode(ab);
document.open();document.write(text);document.close();
}catch(e){document.body.innerHTML="<pre>Load failed: "+e+"\nUse a modern browser (Chrome/Firefox/Safari).</pre>";}
})();
</script></body></html>
