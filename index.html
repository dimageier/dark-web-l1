<!doctype html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>DARK WEB — L1 NOISE</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;background:#0B0B12;color:#E8F0FF;font:12px monospace;display:grid;place-items:center;overflow:hidden}main{text-align:center}canvas{width:min(960px,96vw);height:auto;image-rendering:pixelated;background:#0B0B12;box-shadow:0 0 0 2px #1E2433,0 0 40px #ff2e2e33}p{opacity:.7}kbd{color:#3DDC97;background:#1E2433;padding:2px 5px}</style></head><body><main><canvas id='c' width='960' height='540'></canvas><p><kbd>←→/AD</kbd> move · <kbd>↑/W</kbd> jump · <kbd>Shift/↓</kbd> slide · <kbd>Space</kbd> mute · <kbd>Enter</kbd> start</p></main><script>const C={bg:'#0B0B12',wall:'#1E2433',paper:'#F2E6C9',ui:'#E8F0FF',red:'#FF2E2E',gold:'#FFB020',green:'#3DDC97',violet:'#7B5CFF'},c=document.querySelector('canvas'),x=c.getContext('2d'),W=c.width,H=c.height,K={},J={};addEventListener('keydown',e=>{let k=e.key.toLowerCase();if(['arrowup','arrowdown','arrowleft','arrowright',' ','shift','enter','w','a','s','d'].includes(k))e.preventDefault();if(!K[k])J[k]=1;K[k]=1});addEventListener('keyup',e=>K[e.key.toLowerCase()]=0);c.onclick=()=>J.enter=1;let mode='title',room=0,alert=0,mute=3,facts=0,cam=0,t=0,msg='',mt=0,P={};const R=[{name:'LOBBY CRAWL',w:1400,spawn:[60,450],exit:[1280,300,100,200],plat:[[0,500,1400,40],[0,0,1400,35],[220,420,130,18],[500,380,130,18],[780,420,140,18],[1040,360,140,18]],facts:[[260,390],[820,390]],ticker:1},{name:'BREAKING STACK',w:960,spawn:[70,990],exit:[790,40,130,100],plat:[[0,1060,960,40],[50,960,180,18],[300,860,150,18],[560,760,160,18],[120,650,180,18],[390,540,160,18],[650,420,170,18],[200,300,160,18],[500,180,180,18],[760,90,150,18]],facts:[[580,730]],break:1},{name:'STUDIO — MEGAPHONE',w:960,spawn:[70,450],plat:[[0,500,960,40],[0,0,960,30],[200,420,120,16],[650,420,120,16]],boss:1}];function reset(){let r=R[room];P={x:r.spawn[0],y:r.spawn[1],w:22,h:30,vx:0,vy:0,ground:0,slide:0,inv:0};cam=0}function start(){mode='play';room=0;alert=0;mute=3;facts=0;R.forEach(r=>r.facts&&r.facts.forEach(f=>f[2]=0));R[2].hits=0;reset()}function hit(n){alert=Math.min(100,alert+n);if(alert>=100){mode='dead';mt=1.2;msg='SIGNAL LOST — RESTARTING'}}function say(s){msg=s;mt=1.2}function box(a,b){return a.x<b[0]+b[2]&&a.x+a.w>b[0]&&a.y<b[1]+b[3]&&a.y+a.h>b[1]}function move(){let r=R[room],L=K.arrowleft||K.a,Q=K.arrowright||K.d,U=K.arrowup||K.w,D=K.arrowdown||K.s,sl=(K.shift||D)&&P.ground;if(J.arrowup||J.w)P.vy=-10;if(L){P.vx-=.8}if(Q){P.vx+=.8}P.vx=Math.max(-4.5,Math.min(4.5,P.vx));P.vx*=P.ground?.82:.96;P.vy=Math.min(14,P.vy+.55);P.x+=P.vx;for(let q of r.plat)if(box(P,q)){if(P.vx>0)P.x=q[0]-P.w;else if(P.vx<0)P.x=q[0]+q[2];P.vx=0}P.ground=0;P.y+=P.vy;for(let q of r.plat)if(box(P,q)){if(P.vy>0){P.y=q[1]-P.h;P.vy=0;P.ground=1}else if(P.vy<0){P.y=q[1]+q[3];P.vy=0}}P.x=Math.max(0,Math.min(r.w-P.w,P.x));if(P.y>r.spawn[1]+100){hit(25);reset()}P.slide=sl?1:0;let hh=P.slide?18:30;P.h=hh;if(J[' ']){if(mute){mute--;say('MUTE');let B=R[2].balls||[];R[2].balls=B.filter(b=>Math.hypot(P.x-b.x,P.y-b.y)>100);if(room==2&&B.length!=R[2].balls.length){R[2].hits++;say('CLIP MUTED '+R[2].hits+'/3');if(R[2].hits>=3)mode='win'}}else say('NO MUTE CHARGES')}for(let f of r.facts||[])if(!f[2]&&P.x<f[0]+22&&P.x+P.w>f[0]&&P.y<f[1]+24&&P.y+P.h>f[1]){f[2]=1;facts++;mute=Math.min(3,mute+1);say('+FACT  MUTE REFILLED')}if(r.ticker&&P.y<290&&P.y+P.h>250&&!P.slide)hit(12);if(r.exit&&box(P,r.exit)&&room<2){room++;reset()}if(r.boss){for(let b of r.balls||[])if(box(P,[b.x,b.y,20,20])&&P.inv<=0&&!P.safe){hit(10);P.inv=.6}}P.inv=Math.max(0,P.inv-.016);cam=Math.max(0,Math.min(r.w-W,P.x-W/2))}function update(){let r=R[room];t+=.016;mt=Math.max(0,mt-.016);if(r.break&&Math.floor(t)%4==0&&t%1<.02)hit(2);if(r.boss){r.balls=r.balls||[];if(Math.floor(t*2)%2==0&&t%1<.02){let a=t*1.2;for(let i=0;i<5;i++){let q=a+i*1.1;r.balls.push({x:480,y:250,vx:Math.cos(q)*2.5,vy:Math.sin(q)*2.5})}}for(let b of r.balls){b.x+=b.vx;b.y+=b.vy}}move()}function draw(){let r=R[room];x.fillStyle=C.bg;x.fillRect(0,0,W,H);if(mode=='title'){x.textAlign='center';x.fillStyle=C.red;x.font='bold 64px monospace';x.fillText('DARK WEB',W/2,190);x.fillStyle=C.gold;x.font='bold 28px monospace';x.fillText('L1 · NOISE',W/2,235);x.fillStyle=C.ui;x.font='14px monospace';x.fillText('survive the information storm',W/2,275);if(Math.floor(t*2)%2)x.fillStyle=C.green,x.fillText('PRESS ENTER / CLICK TO START',W/2,360);x.font='12px monospace';x.fillStyle='#E8F0FF88';x.fillText('Alex Jones stage · parody stub · no real likenesses',W/2,420);x.textAlign='left';return}x.save();x.translate(-cam,0);x.strokeStyle='#1E243388';for(let z=0;z<r.w;z+=40){x.beginPath();x.moveTo(z,0);x.lineTo(z,H);x.stroke()}for(let q of r.plat){x.fillStyle=C.wall;x.fillRect(...q);x.fillStyle='#E8F0FF22';x.fillRect(q[0],q[1],q[2],2)}if(r.ticker){x.fillStyle=C.gold;x.fillRect(0,250,r.w,28);x.fillStyle=C.bg;x.font='bold 14px monospace';x.fillText('THE FROGS ARE EMAILING    BREAKING    FROGS EMAILING',-t*80%600,269)}for(let f of r.facts||[])if(!f[2]){x.fillStyle=C.paper;x.fillRect(f[0],f[1]+Math.sin(t*4)*3,18,23);x.fillStyle=C.wall;x.fillRect(f[0]+3,f[1]+6,12,3);x.fillRect(f[0]+3,f[1]+13,12,3)}if(r.exit){x.strokeStyle=C.green;x.strokeRect(...r.exit);x.fillStyle=C.green;x.font='bold 12px monospace';x.fillText('EXIT →',r.exit[0]+10,r.exit[1]+50)}if(r.boss){x.fillStyle=C.wall;x.beginPath();x.moveTo(450,250);x.lineTo(540,205);x.lineTo(540,315);x.lineTo(450,275);x.fill();x.fillStyle=C.red;x.fillRect(430,245,30,40);x.fillStyle=C.orange;x.font='bold 14px monospace';x.fillText('CLIPS '+(r.hits||0)+'/3',440,360);for(let b of r.balls||[]){x.fillStyle=C.gold;x.beginPath();x.arc(b.x+10,b.y+10,10,0,7);x.fill()}}x.fillStyle=C.paper;x.fillRect(P.x+4,P.y+8,14,P.h-12);x.fillStyle=C.bg;x.fillRect(P.x+6,P.y+10,10,6);x.restore();x.fillStyle=C.wall;x.fillRect(20,14,280,18);x.fillStyle=C.red;x.fillRect(20,14,280*alert/100,18);x.strokeStyle=C.ui;x.strokeRect(20,14,280,18);x.fillStyle=C.ui;x.font='bold 11px monospace';x.fillText('ALERT '+Math.floor(alert)+'%',28,27);x.fillText('MUTE',320,27);for(let i=0;i<3;i++){x.fillStyle=i<mute?C.green:C.wall;x.fillRect(365+i*22,14,16,16);x.strokeRect(365+i*22,14,16,16)}x.fillStyle=C.paper;x.fillText('FACTS '+facts+'/3',460,27);x.fillStyle=C.violet;x.textAlign='right';x.fillText(r.name,W-20,27);x.textAlign='left';if(mt){x.fillStyle=C.green;x.textAlign='center';x.font='bold 16px monospace';x.fillText(msg,W/2,60);x.textAlign='left'}for(let yy=0;yy<H;yy+=3){x.fillStyle='#00000014';x.fillRect(0,yy,W,1)}}function loop(){if(mode=='title'){if(J.enter||J[' '])start()}else if(mode=='play')update();else if(mode=='dead'){mt-=.016;if(mt<=0){mode='play';reset()}}else if(mode=='win'&&(J.enter||J[' ']))start();draw();for(let k in J)delete J[k];requestAnimationFrame(loop)}loop();</script></body></html>
