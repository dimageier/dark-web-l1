<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>DARK WEB — L1 NOISE</title>
<style>html,body{margin:0;height:100%;background:#0B0B12;color:#F2E6C9;font:14px monospace;display:grid;place-items:center}</style>
</head><body><p>LOADING NOISE…</p>
<script>
/* dark-web-l1 complete — stitch gzip parts c0..c24 */
(async()=>{
try{
const N=25;
const parts=await Promise.all(Array.from({length:N},(_,i)=>fetch("c"+i+".txt").then(r=>r.text())));
const b64=parts.join("");
const bin=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));
const ds=new DecompressionStream("gzip");
const ab=await new Response(new Blob([bin]).stream().pipeThrough(ds)).arrayBuffer();
const text=new TextDecoder().decode(ab);
document.open();document.write(text);document.close();
}catch(e){document.body.innerHTML="<pre>Load failed: "+e+"\nUse a modern browser (Chrome/Firefox/Safari).</pre>";}
})();
</script></body></html>
